# This workflow is used to deploy a safe-wallet-monorepo release to IPFS
name: Safe-Wallet-Monorepo Web Release on IPFS

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  workflow_dispatch: # Allows manual triggering

jobs:
  ## Check if a new release of safe-wallet-monorepo is available
  ## Outputs:
  ## - new_release: true if a new release is available, false otherwise
  ## - latest_tag: the tag of the latest release
  ## - tar_url: the URL of the tarball of the latest release
  ## - checksum_url: the URL of the checksum of the latest release
  check-release:
    runs-on: ubuntu-latest
    name: Check for new release

    outputs:
      new_release: ${{ steps.compare.outputs.new_release }}
      latest_tag: ${{ steps.latest_release_info.outputs.latest_tag }}
      tar_url: ${{ steps.latest_release_info.outputs.tar_url }}
      checksum_url: ${{ steps.latest_release_info.outputs.checksum_url }}

    steps:
      - name: Get latest release info
        id: latest_release_info
        env:
          API_URL: https://api.github.com/repos/safe-global/safe-wallet-monorepo/releases
          ## The monorepo publishes one release stream per app and prefixes the tag
          ## accordingly (web-v*, tx-builder-v*, ...). We only deploy the web app.
          ## Tags were unprefixed ("v*") until web-v1.86.0 (2026-04-01).
          RELEASE_TAG_PREFIX: web-v
          MAX_ATTEMPTS: 3 ## Max number of attempts to fetch the release info
          DELAY: 10 ## seconds
        run: |
          ## Fetch the latest release info from the GitHub API with retry logic
          ## This is necessary because the GitHub API sometimes fails
          ## see https://github.com/5afe/safe-wallet-ipfs/actions/runs/14427680232/job/40458689018
          attempt=1
          while true; do
            echo "Attempt $attempt to fetch release info..."
            if curl -sSf "$API_URL" > /tmp/releases.json && jq -e '. | length > 0' /tmp/releases.json > /dev/null; then
              # Filter for the latest non-draft, non-prerelease web release
              jq --arg prefix "$RELEASE_TAG_PREFIX" \
                '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith($prefix)))][0]' \
                /tmp/releases.json > /tmp/release_info.json

              # Check if we found a valid release carrying the assets we need
              if jq -e '.assets? // [] | length > 0' /tmp/release_info.json > /dev/null; then
                break
              fi

              echo "No stable '$RELEASE_TAG_PREFIX*' release with assets found, retrying..."
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "Failed to fetch release info after $attempt attempts."
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep "$DELAY"
          done

          ## Extract the tag name, tar URL, and checksum URL from the release info
          TAG_NAME=$(jq -r '.tag_name' /tmp/release_info.json)
          TAR_URL=$(jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' /tmp/release_info.json)
          CHECKSUM_URL=$(jq -r '.assets[] | select(.name | endswith("-sha256-checksum.txt")) | .browser_download_url' /tmp/release_info.json)

          ## Fail loudly rather than deploying a release we could not fully resolve
          if [ -z "$TAR_URL" ] || [ -z "$CHECKSUM_URL" ]; then
            echo "Release $TAG_NAME is missing the tarball or the checksum asset." >&2
            exit 1
          fi

          ## Store the tag name, tar URL, and checksum URL in the GitHub output
          echo "latest_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tar_url=$TAR_URL" >> "$GITHUB_OUTPUT"
          echo "checksum_url=$CHECKSUM_URL" >> "$GITHUB_OUTPUT"

      - name: Restore last release tag
        id: restore-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .prev_release
          key: latest-release-${{ steps.latest_release_info.outputs.latest_tag }}
          restore-keys: |
            latest-release-

      - name: Compare current tag with cached release tag
        id: compare
        run: |
          TAG_NAME=${{ steps.latest_release_info.outputs.latest_tag }}
          PREV_TAG_NAME=$(cat .prev_release 2>/dev/null || echo "none")
          echo "Previous tag: $PREV_TAG_NAME"
          echo "Current tag: $TAG_NAME"

          if [ "$TAG_NAME" != "null" ] && [ "$TAG_NAME" != "$PREV_TAG_NAME" ]; then
            echo "New release detected :: $TAG_NAME"
            echo "new_release=true" >> $GITHUB_OUTPUT
          else
            echo "No new release detected"
            echo "new_release=false" >> $GITHUB_OUTPUT
          fi

  ## Deploy the web app to IPFS
  ## Outputs:
  ## - cid: the IPFS hash (CID) of the deployed web app
  deploy:
    if: ${{ needs.check-release.outputs.new_release == 'true' }}
    runs-on: ubuntu-latest
    name: Deploy to IPFS
    needs: check-release

    outputs:
      cid: ${{ steps.deploy_ipfs.outputs.cid }}

    permissions:
      contents: read

    steps:
      - name: Download Tarball and Checksum
        run: |
          curl -L "${{ needs.check-release.outputs.tar_url }}" -o /tmp/release.tar.gz  || { echo "Download failed!" >&2; exit 1; }
          curl -L "${{ needs.check-release.outputs.checksum_url }}" -o /tmp/checksum.txt  || { echo "Download failed!" >&2; exit 1; }

      - name: Verify Checksum
        run: |
          CHECKSUM_EXPECTED=$(cat /tmp/checksum.txt | awk '{print $1}')
          CHECKSUM_ACTUAL=$(sha256sum /tmp/release.tar.gz | awk '{print $1}')

          if [ "$CHECKSUM_EXPECTED" != "$CHECKSUM_ACTUAL" ]; then
            echo "Checksum verification failed!" >&2
            exit 1
          fi

      - name: Extract Tarball
        run: |
          mkdir -p /tmp/release
          tar -xzf /tmp/release.tar.gz -C /tmp/release
          echo "Extracted files:"
          ls -lah /tmp/release

      - name: Remove .html extension from all files
        run: |
          for file in $(find /tmp/release/out -name '*.html' | sed 's|^\./||'); do
            if [ -d ${file%.*} ]; then
              cp ${file%} ${file%.*}/index.html
            else
              cp ${file%} ${file%.*}
            fi
          done

      ## Kubo is fetched directly rather than via ipfs/download-ipfs-distribution-action
      ## because this repo requires every action to be pinned to a full-length commit
      ## SHA, and that check is transitive: ipshipyard/ipfs-deploy-action@v2 references
      ## five nested actions by floating tag, so it cannot be consumed here even when
      ## pinned itself. Pinning the release tarball's digest is the stronger guarantee
      ## anyway -- a SHA-pinned installer action would still fetch a mutable dist.
      - name: Set up Kubo
        env:
          KUBO_VERSION: v0.42.0
          ## sha512 of kubo_${KUBO_VERSION}_linux-amd64.tar.gz, matching
          ## https://dist.ipfs.tech/kubo/v0.42.0/kubo_v0.42.0_linux-amd64.tar.gz.sha512
          KUBO_SHA512: 054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
        run: |
          ## The pinned digest is the linux-amd64 build, so fail loudly rather than
          ## silently mismatching if this job is ever moved to another runner arch.
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::Expected an x86_64 runner, got $(uname -m). Update KUBO_SHA512 for this arch." >&2
            exit 1
          fi

          cd /tmp
          curl -sSfL "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz" -o kubo.tar.gz
          echo "${KUBO_SHA512}  kubo.tar.gz" | sha512sum -c -
          tar -xzf kubo.tar.gz
          echo "/tmp/kubo" >> "$GITHUB_PATH"

      ## Merkleize the build into a CAR file, then pin it to Pinata below. This mirrors
      ## what ipfs-deploy-action v2 does for our configuration; of its 16 steps we only
      ## ever ran these, since the commit-status, PR-comment and CAR-artifact steps are
      ## all gated off when no Kubo or IPFS Cluster endpoint is configured.
      - name: Create IPFS CAR
        id: deploy_ipfs
        env:
          PATH_TO_DEPLOY: /tmp/release/out
          CAR_PATH: /tmp/build.car
          ## IPIP-0499 defaults, resolving to CidVersion 1 + the size-1048576 chunker
          ## + raw leaves. Verified to produce the same root CID as both the profile
          ## used since #3 and the "--cid-version 1 --chunker size-1048576" of v1.
          CID_PROFILE: unixfs-v1-2025
          IPFS_PATH: /tmp/ipfs-repo
        run: |
          if [ ! -d "$PATH_TO_DEPLOY" ] || [ -z "$(ls -A "$PATH_TO_DEPLOY")" ]; then
            echo "::error::$PATH_TO_DEPLOY does not exist or is empty" >&2
            exit 1
          fi

          ipfs init > /dev/null
          ipfs config profile apply "$CID_PROFILE" > /dev/null

          ## No daemon is running, so this stays entirely local to the runner
          CID=$(ipfs add -Q -r "$PATH_TO_DEPLOY")
          if [ -z "$CID" ]; then
            echo "::error::ipfs add returned an empty CID" >&2
            exit 1
          fi
          ipfs dag export "$CID" > "$CAR_PATH"

          echo "cid=$CID" >> "$GITHUB_OUTPUT"
          echo "car-path=$CAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Root CID: $CID"

      ## Pinata V3 Files API, following the upstream recipe:
      ## https://github.com/ipshipyard/ipfs-deploy-action/blob/main/docs/recipes/pinata.md
      - name: Upload CAR to Pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
          CID: ${{ steps.deploy_ipfs.outputs.cid }}
          CAR_PATH: ${{ steps.deploy_ipfs.outputs.car-path }}
          PIN_NAME: safe-wallet-monorepo-${{ needs.check-release.outputs.latest_tag }}
        run: |
          ## "car=true" makes Pinata unpack the CAR server-side and pin its root CID
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://uploads.pinata.cloud/v3/files" \
            -H "Authorization: Bearer ${PINATA_JWT}" \
            -F "network=public" \
            -F "file=@${CAR_PATH}" \
            -F "name=${PIN_NAME}" \
            -F "car=true")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            echo "::error::Pinata upload failed (HTTP $http_code): $body"
            exit 1
          fi

          ## A mismatch would mean the release note advertises a CID that nobody pinned,
          ## so treat it as a hard failure instead of the warning the recipe suggests.
          returned_cid=$(echo "$body" | jq -r '.data.cid')
          if [ "$returned_cid" != "$CID" ]; then
            echo "::error::Pinata pinned CID $returned_cid but the CAR root is $CID"
            exit 1
          fi

          echo "Pinned ${PIN_NAME} on Pinata (CID ${returned_cid})"

      - name: Clean up temporary files
        run: |
          rm -rf /tmp/release /tmp/checksum.txt /tmp/release.tar.gz \
                 /tmp/build.car /tmp/ipfs-repo /tmp/kubo /tmp/kubo.tar.gz

  ## Create a release note
  release_note:
    if: ${{ needs.deploy.outputs.cid != '' }}
    runs-on: ubuntu-latest
    name: Create Release Note
    needs:
      - check-release
      - deploy

    permissions:
      contents: write

    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-release.outputs.latest_tag }}
          name: safe-wallet-monorepo ${{ needs.check-release.outputs.latest_tag }}
          body: |
            - 🧩 Version: `${{ needs.check-release.outputs.latest_tag }}`
            - 📦 Release link: https://github.com/safe-global/safe-wallet-monorepo/releases/tag/${{ needs.check-release.outputs.latest_tag }}
            - 🔏 CID: `${{ needs.deploy.outputs.cid }}`
            - 🌐 Preview:
              - [https://${{ needs.deploy.outputs.cid }}.ipfs.dweb.link](https://${{ needs.deploy.outputs.cid }}.ipfs.dweb.link/)
              - [https://${{ needs.deploy.outputs.cid }}.ipfs.inbrowser.link](https://${{ needs.deploy.outputs.cid }}.ipfs.inbrowser.link/)
          draft: false
          prerelease: false

      - name: Prepare to store Last Release Tag in Cache
        id: prepare-cache-last-release-tag
        run: |
          TAG_NAME=${{ needs.check-release.outputs.latest_tag }}
          echo "$TAG_NAME" > .prev_release

      - name: Cache Last Release Tag
        id: cache-last-release-tag
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .prev_release
          key: latest-release-${{ needs.check-release.outputs.latest_tag }}
